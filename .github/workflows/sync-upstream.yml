name: Sync upstream into TauriTavern branch

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-tauritavern
  cancel-in-progress: false

env:
  TARGET_BRANCH: TauriTavern-branch
  UPSTREAM_REPOSITORY: baibai-git/ST-BaiBai-Tools
  UPSTREAM_BRANCH: main
  # updateCheck.js 在分支里只改了更新源,冲突时要先回落上游再换回来。
  UPSTREAM_MANIFEST_URL: baibai-git/SillyTavern-Mobile-Resize-Guard/main/manifest.json
  BRANCH_MANIFEST_URL: exynos967/ST-BaiBai-Tools/TauriTavern-branch/manifest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "${TARGET_BRANCH} already contains upstream/${UPSTREAM_BRANCH}."
            exit 0
          fi

          if ! git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
            mapfile -t conflicted_files < <(git diff --name-only --diff-filter=U)

            for conflicted_file in "${conflicted_files[@]}"; do
              case "${conflicted_file}" in
                manifest.json|dist/index.js|package.json|package-lock.json)
                  git checkout --theirs -- "${conflicted_file}"
                  git add "${conflicted_file}"
                  ;;
                src/features/updateCheck.js)
                  # 上游重构版本检测时取它的实现,再把浏览器回退读取的更新源换回
                  # 本分支;上游若挪走这段地址,守卫失败而不是静默丢掉更新源。
                  git checkout --theirs -- "${conflicted_file}"
                  grep -qF "${UPSTREAM_MANIFEST_URL}" "${conflicted_file}" || {
                    printf 'TauriTavern update source anchor missing in %s\n' "${conflicted_file}" >&2
                    exit 1
                  }
                  sed -i "s#${UPSTREAM_MANIFEST_URL}#${BRANCH_MANIFEST_URL}#g" "${conflicted_file}"
                  grep -qF "${BRANCH_MANIFEST_URL}" "${conflicted_file}"
                  git add "${conflicted_file}"
                  ;;
                *)
                  printf 'Unresolved source conflict: %s\n' "${conflicted_file}" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

          manifest.homePage = 'https://github.com/exynos967/ST-BaiBai-Tools/tree/TauriTavern-branch';
          manifest.auto_update = true;
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 4)}\n`);
          NODE

          npm ci
          npm run build
          git add manifest.json dist/index.js
          git diff --cached --check
          git commit --no-edit

          git push origin "HEAD:${TARGET_BRANCH}"
