name: Sync upstream into TauriTavern branch

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-tauritavern
  cancel-in-progress: false

env:
  TARGET_BRANCH: TauriTavern-branch
  UPSTREAM_REPOSITORY: baibai-git/ST-BaiBai-Tools
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "${TARGET_BRANCH} already contains upstream/${UPSTREAM_BRANCH}."
            exit 0
          fi

          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            mapfile -t conflicted_files < <(git diff --name-only --diff-filter=U)

            if [[ ${#conflicted_files[@]} -ne 1 || ${conflicted_files[0]} != "manifest.json" ]]; then
              printf 'Unresolved upstream conflicts:\n%s\n' "${conflicted_files[*]}" >&2
              exit 1
            fi

            git checkout --theirs -- manifest.json
            node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

          manifest.homePage = 'https://github.com/exynos967/ST-BaiBai-Tools/tree/TauriTavern-branch';
          manifest.auto_update = true;
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 4)}\n`);
          NODE
            git add manifest.json
            git commit --no-edit
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
